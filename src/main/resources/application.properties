spring.application.name=mcpclient

server.port=8082

# Ollama Local Configuration
spring.ai.ollama.base-url=http://localhost:11434
# Choose a tool-capable model (ensure you ran 'ollama run llama3.1' first)
spring.ai.ollama.chat.options.model=llama3.1

# Tell Spring AI to use standard Open-AI formatted tool structures if Ollama's strict endpoint fails
spring.ai.ollama.chat.options.strict-tools=false

# MCP Client Configuration (Stays the exact same)
spring.ai.mcp.client.name=my-java-mcp-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.tool-callbacks.enabled=true

# Streamable HTTP Connection pointing to your server
spring.ai.mcp.client.streamable-http.connections.my-local-server.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.my-local-server.endpoint=/mcp

# Enable verbose logging to see exactly what tool schema Ollama is complaining about
logging.level.org.springframework.ai=DEBUG

# Prints all structural transport messages (SSE / HTTP Streamable payloads)
logging.level.org.springframework.ai.mcp=DEBUG

# Prints the tool executions inside Spring AI's ChatClient pipeline
logging.level.org.springframework.ai.chat.client=DEBUG
